<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Art by Cinderous — CinderousRex</title>
  <meta name="description" content="I draw pixel emotes for chat. Between drawings, I’m usually in a VALORANT Swiftplay.">
  <link rel="canonical" href="https://cinderous.me/">
  <meta property="og:title" content="Art by Cinderous">
  <meta property="og:description" content="Anubis Arrives. Pixel emotes and frame studies by CinderousRex.">
  <meta property="og:url" content="https://cinderous.me/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://cinderous.me/anubis-share.png">
  <meta property="og:image:alt" content="Three frames of Anubis descending, landing, and standing.">
  <style>
    :root { color-scheme: dark; --ink: #19181c; --text: #f4eee6; --muted: #c2b9bd; --gold: #d5d590; --rule: #423c44; }
    * { box-sizing: border-box; }
    body { max-width: 68rem; margin: auto; padding: 0 clamp(1.1rem, 5vw, 4rem) 3rem; background: var(--ink); color: var(--text); font: 1rem/1.5 system-ui, sans-serif; }
    a { color: inherit; text-underline-offset: .25em; }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    .mast, .caption { display: flex; align-items: center; justify-content: space-between; gap: .85rem; }
    .mast { padding: 1.4rem 0; border-bottom: 1px solid var(--rule); }
    .brand { font-weight: 750; font-size: 1.2rem; text-decoration: none; }
    .brand span, .signature { color: var(--gold); }
    .mast nav, .caption, .byline { font-size: .85rem; color: var(--muted); }
    .feature { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: clamp(2rem, 6vw, 5rem); padding: clamp(2rem, 6vw, 4.5rem) 0; }
    .byline { margin: 0; }
    h1 { margin: .5rem 0 1rem; font: 500 clamp(3.4rem, 7vw, 6rem)/.95 Georgia, serif; letter-spacing: -.055em; }
    h1 em { display: block; color: #dfcce7; font-weight: inherit; }
    .bio { max-width: 32ch; }
    .signature { margin: 1.25rem 0 0; font: italic 1.1rem Georgia, serif; }
    figure { margin: 0; min-width: 0; }
    .stage, .thumb { display: grid; place-items: center; overflow: hidden; }
    .stage { aspect-ratio: 4 / 3; background: radial-gradient(ellipse at 50% 70%, #b4a5b5, #94849b 70%); }
    .sprite { display: block; image-rendering: pixelated; object-fit: contain; }
    .stage .sprite { width: min(224px, 100%); height: auto; }
    .caption { padding-top: .6rem; flex-wrap: wrap; }
    #studies { padding-top: 1.3rem; border-top: 1px solid var(--rule); }
    h2 { margin: 0 0 1rem; font: 500 1.65rem Georgia, serif; }
    .works { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 1rem; }
    .work { min-width: 0; text-decoration: none; }
    .work:hover .name, .work:focus-visible .name { text-decoration: underline; }
    .thumb { height: clamp(7rem, 14vw, 10rem); }
    .study { background: #b8adba; }
    .egg { background: #2d2537; }
    .phoenix { background: #302527; }
    .thumb .sprite { width: 112px; max-width: 100%; height: auto; }
    .phoenix img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .name { display: block; margin-top: .5rem; font-size: .9rem; }
    @media (max-width: 42rem) {
      .feature { grid-template-columns: 1fr; gap: 1.5rem; }
      h1 em { display: inline; }
      .works { grid-template-columns: 1fr 1fr; }
      .work:last-child { grid-column: 1 / -1; }
      .phoenix { height: auto; aspect-ratio: 16 / 9; }
    }
  </style>
</head>
<body id="top">
  <header class="mast">
    <a class="brand" href="#top" aria-label="CinderousRex home">Cinderous<span>Rex</span></a>
    <nav aria-label="Gallery"><a href="#studies">Frame studies</a></nav>
  </header>
  <main>
    <section class="feature" aria-labelledby="title">
      <div>
        <p class="byline">Art by Cinderous</p>
        <h1 id="title">Anubis <em>Arrives</em></h1>
        <p class="bio">I draw pixel emotes for chat. Between drawings, I’m usually in a VALORANT Swiftplay.</p>
        <p class="signature">Prideful Being Grounded</p>
      </div>
      <figure>
        <a class="stage" href="cinderousarrives2.gif" aria-label="Open the Anubis Arrives landing GIF">
          <picture>
            <source media="(prefers-reduced-motion: no-preference)" srcset="cinderousarrives2.gif">
            <img class="sprite" src="arrives-held.png" width="112" height="112" alt="An ash-gold jackal lands with both feet planted.">
          </picture>
        </a>
        <figcaption class="caption"><span>Frames edited by CinderousRex</span><a href="cinderousarrives2.gif">Open landing GIF</a></figcaption>
      </figure>
    </section>
    <div>
        <a class="work" href="desaturatedasmyshadowkeptburning.gif">
          <span class="thumb phoenix"><img src="desaturatedasmyshadowkeptburning.png" width="1280" height="720" alt="Phoenix raises his flaming fists in VALORANT."></span>
          <span class="name">Desaturated as my shadow kept burning.</span>
        </a>
    </div>
  </main>
</body>
</html>
